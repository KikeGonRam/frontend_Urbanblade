name: Semgrep

# Análisis estático (SAST) con las reglas OWASP Top 10 (HT-07 / TT19-TT20). Bloquea el PR si aparece un hallazgo de
# severidad ERROR. Los falsos positivos se suprimen en la línea con `// nosemgrep: <regla>` y una justificación; el
# procedimiento está en docs/PRUEBAS.md («Análisis estático»).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Semgrep (OWASP Top 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.182.1
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep OWASP Top 10
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: >
          semgrep scan
          --config p/owasp-top-ten
          --severity ERROR
          --error
          --metrics=off
          --exclude node_modules --exclude .nuxt --exclude .output --exclude dist --exclude coverage
          --exclude .claude --exclude .agents --exclude docs
